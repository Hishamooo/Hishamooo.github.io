<!DOCTYPE html>

    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script>
      // GitHub Pages SPA routing — 404.html redirects deep links to /?p=<path>.
      // Restore the real URL before vue-router reads window.location.
      (function () {
        var p = new URLSearchParams(window.location.search).get('p');
        if (p) {
          window.history.replaceState(null, '', '/' + p + window.location.hash);
        }
      })();
    </script>

    <title>Hisham Al Hafez | Software Developer in Madrid</title>
